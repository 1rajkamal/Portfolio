<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/me.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raj Kamal — Data Analyst & Developer | 3D Interactive Portfolio</title>
    <meta name="description" content="Portfolio of Raj Kamal — Data Analyst, Python, Machine Learning & AI Developer. Explore interactive 3D world, projects, skills and experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      html.dark, html.dark body {
        background-color: #0A0A0F;
        color: #F8FAFC;
        margin: 0;
        padding: 0;
      }
      html.light, html.light body {
        background-color: #FAF9F6;
        color: #0F172A;
        margin: 0;
        padding: 0;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0A0A0F;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Inter', system-ui, sans-serif;
        color: #F8FAFC;
      }
      .loader-spin {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-[var(--accent)] selection:text-white min-h-screen overflow-x-hidden">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-spin"></div>
        <p style="margin-top: 16px; font-size: 13px; letter-spacing: 0.08em; color: #94A3B8; font-family: monospace;">INITIALIZING RAJ KAMAL OS...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
